<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Committee Task Manager</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <header class="header">
            <div>
                <p class="subtitle">COMMITTEE MANAGEMENT</p>
                <h1>Committee Task Manager</h1>
            </div>
        </header>


        <section class="statistics">

            <div class="stat-card">
                <span class="stat-label">Total Tasks</span>
                <span id="totalTasks" class="stat-number">0</span>
            </div>

            <div class="stat-card">
                <span class="stat-label">Completed</span>
                <span id="completedTasks" class="stat-number">0</span>
            </div>

            <div class="stat-card">
                <span class="stat-label">Pending</span>
                <span id="pendingTasks" class="stat-number">0</span>
            </div>

        </section>

        <section class="card">

            <div class="section-heading">
                <h2>Add New Task</h2>
                <p>Create and assign a task to a committee member.</p>
            </div>

            <form id="taskForm">

                <div class="form-grid">

                    <div class="form-group">
                        <label for="taskTitle">Task Title</label>

                        <input
                            type="text"
                            id="taskTitle"
                            placeholder="e.g. Create Event Poster"
                        >
                    </div>


                    <div class="form-group">
                        <label for="assignedMember">Assigned Member</label>

                        <select id="assignedMember">
                            <option value="">Loading members...</option>
                        </select>
                    </div>


                    <div class="form-group">
                        <label for="priority">Priority</label>

                        <select id="priority">

                            <option value="">
                                Select Priority
                            </option>

                            <option value="Low">
                                Low
                            </option>

                            <option value="Medium">
                                Medium
                            </option>

                            <option value="High">
                                High
                            </option>

                        </select>
                    </div>


                    <div class="form-group">
                        <label for="deadline">Deadline</label>

                        <input
                            type="date"
                            id="deadline"
                        >
                    </div>

                </div>

                <p id="errorMessage" class="error-message"></p>

                <button type="submit" class="primary-btn">+ Add Task</button>

            </form>

        </section>


        <section class="card">

            <div class="section-heading">
                <h2>Tasks</h2>
                <p>Search and filter committee tasks.</p>
            </div>


            <div class="controls">

                <div class="search-box">

                    <label for="searchInput">Search</label>

                    <input
                        type="text"
                        id="searchInput"
                        placeholder="Search by task title..."
                    >

                </div>


                <div class="filter-box">

                    <label for="statusFilter">Status</label>

                    <select id="statusFilter">

                        <option value="All">All</option>

                        <option value="Pending">Pending</option>

                        <option value="Completed">Completed </option>

                    </select>

                </div>

                <div class="filter-box">
                    <label for="priorityFilter">Priority</label>
                    <select id="priorityFilter">
                        <option value="All">All</option>
                        <option value="Low">Low</option>
                        <option value="Medium">Medium</option>
                        <option value="High">High</option>
                    </select>
                </div>

            </div>

        </section>


        <div id="loadingMessage" class="loading">
            Loading committee members...
        </div>


        <section id="taskList" class="task-list">
        </section>


        <div id="emptyState" class="empty-state">
            <div class="empty-icon">✓</div>
            <h3>No Tasks Found</h3>
            <p>Add a new task or change your search/filter options.</p>
        </div>

    </div>


    <script src="storage.js"></script>
    <script src="Tasks.js"></script>
    <script src="Main.js"></script>

</body>
</html>
